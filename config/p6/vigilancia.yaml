# Proyecto 6 · Vigilancia técnica de la fuente (extra, issue #33). Ver docs/p6/extras.md.
#
# Va aparte de monitoreo.yaml a propósito: no decide la confianza del modelo, así que no entra en
# config_ref y la serie de confianza (referencia, C1, C2) sigue siendo comparable. Su identidad es
# `vigilancia_ref` (SHA-256 del contenido efectivo), que queda en run.json y en cada alerta de fuente.

version: 1

fuente_sin_senal:
  rule_id: fuente-sin-senal-v1
  descripcion: >-
    No llega ningún frame de la fuente durante más de sin_frames_ms (reloj de la corrida). Se
    cierra cuando vuelven a llegar frames_recuperacion frames seguidos.
  # Con muestreo de 1 frame por segundo de video, 5 s sin frames son 5 frames esperados perdidos:
  # suficiente para no confundir una inferencia lenta (~0.5 s) con una caída de la fuente.
  sin_frames_ms: 5000
  frames_recuperacion: 3
  severidad: critica
  accion_sugerida: >-
    Revisar la conexión con la fuente (red, cámara, servidor del stream). Mientras no haya frames,
    las ventanas de confianza quedan insuficientes: no interpretar su ausencia de alertas como
    operación sana.

# --- Reglas técnicas por ventana (extras S3 y S4, issue #37) --------------------------------------
# Misma ventana de 10 s de video que la confianza. Con 1 frame por segundo, una ventana completa tiene
# 10 frames; menos de minimo_frames es "insuficiente" (no abre ni cierra), como en las de confianza.

errores_inferencia:
  rule_id: errores-inferencia-v1
  descripcion: >-
    Fracción de frames procesados de la ventana cuyo evento terminó con status error (el modelo no
    produjo salida) mayor o igual que el umbral.
  # La mitad de los frames sin inferencia ya deja la ventana sin evidencia útil de confianza.
  umbral: 0.5
  minimo_frames: 5
  severidad: critica
  accion_sugerida: >-
    Revisar los códigos y mensajes de error del diagnóstico (runtime del modelo, memoria, pesos,
    formato de entrada). Mientras falle, la confianza de esas ventanas no es interpretable.

saturacion:
  rule_id: saturacion-v1
  descripcion: >-
    Fracción de frames que llegaron en la ventana y se descartaron por saturación (atraso mayor que
    muestreo.atraso_max_ms) mayor o igual que el umbral.
  # 1 de cada 5 frames perdido por atraso ya es una pérdida de cobertura notable a 1 fps.
  umbral: 0.2
  minimo_frames: 5
  severidad: advertencia
  accion_sugerida: >-
    El procesamiento no alcanza el ritmo de la fuente: revisar el tiempo de inferencia y la cola del
    diagnóstico, la carga de CPU de la máquina o bajar el muestreo. Los frames descartados no se
    infieren, así que la ventana pierde cobertura.
